<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- URL入力画面 -->
    <div id="input-container" class="hidden">
        <div class="input-wrapper" role="dialog" aria-labelledby="input-title">
            <div class="input-header">
                <div class="logo">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M7 4.5v15a1 1 0 0 0 1.52.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"></path>
                    </svg>
                    <span id="input-title">Movie Player</span>
                </div>
                <button type="button" class="close-btn" id="input-close-btn" aria-label="閉じる" title="閉じる (ESC)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="input-body">
                <label class="input-description" for="url-input">YouTube または Twitch の URL</label>

                <div class="url-input-group">
                    <div class="input-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                        </svg>
                    </div>
                    <input type="text"
                           id="url-input"
                           placeholder="youtube.com/watch?v=… または twitch.tv/…"
                           autocomplete="off"
                           spellcheck="false"
                           maxlength="300"
                           aria-describedby="error-message">
                    <button type="button" class="paste-btn" id="paste-btn" aria-label="クリップボードから貼り付け" title="クリップボードから貼り付け">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="8" y="2" width="8" height="4" rx="1"></rect>
                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        </svg>
                    </button>
                </div>

                <p class="error-message hidden" id="error-message" role="alert"></p>

                <div class="supported-platforms">
                    <div class="platform-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                        </svg>
                        <span><b>YouTube</b> 動画・ショート・ライブ</span>
                    </div>
                    <div class="platform-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>
                        </svg>
                        <span><b>Twitch</b> 配信・VOD・クリップ</span>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="play-btn" id="play-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M7 4.5v15a1 1 0 0 0 1.52.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"></path>
                        </svg>
                        <span>再生</span>
                    </button>
                    <button type="button" class="share-btn" id="share-btn" aria-expanded="false" aria-controls="player-list-container">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <span>近くの人に共有</span>
                    </button>
                </div>

                <button type="button" class="place-btn hidden" id="place-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="2" y="4" width="20" height="13" rx="2"></rect>
                        <path d="M8 21h8"></path>
                        <path d="M12 17v4"></path>
                    </svg>
                    <span>空間にスクリーンを置く</span>
                    <span class="place-btn-note">URL を入れておくと、置いたスクリーンで再生</span>
                </button>

                <!-- 付近のプレイヤーリスト -->
                <div class="player-list-container hidden" id="player-list-container">
                    <div class="player-list-header">
                        <div class="player-list-title">
                            <span>付近のプレイヤー</span>
                            <span class="player-list-meta" aria-live="polite"><span id="player-range">50m 以内</span> · <span id="player-count">0人</span></span>
                        </div>
                        <div class="player-list-tools">
                            <button type="button" class="list-action-btn" id="select-all-btn">全選択</button>
                            <button type="button" class="list-action-btn" id="refresh-btn" aria-label="一覧を更新" title="一覧を更新">更新</button>
                        </div>
                    </div>
                    <div class="player-list" id="player-list" role="group" aria-label="共有先のプレイヤー">
                        <div class="no-players">付近にプレイヤーがいません</div>
                    </div>
                    <button type="button" class="share-confirm-btn" id="share-confirm-btn" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M22 2L11 13"></path>
                            <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
                        </svg>
                        <span>共有する相手を選択</span>
                    </button>
                </div>

                <!-- 近くで上映中（参加を申請できる） -->
                <div class="session-list-container hidden" id="session-list-container">
                    <div class="player-list-header">
                        <div class="player-list-title">
                            <span>近くで上映中</span>
                            <span class="player-list-meta" id="session-count" aria-live="polite">0件</span>
                        </div>
                    </div>
                    <div class="player-list" id="session-list" role="list" aria-label="近くの上映"></div>
                </div>
            </div>

            <div class="input-footer">
                <label class="receive-toggle" for="receive-toggle">
                    <input type="checkbox" id="receive-toggle" checked>
                    <span class="receive-toggle-track" aria-hidden="true"></span>
                    <span>共有を受け取る</span>
                </label>
                <span class="input-footer-sep" aria-hidden="true"></span>
                <span class="input-footer-hint">
                    <kbd>ESC</kbd>
                    <span>で閉じる</span>
                </span>
            </div>
        </div>
    </div>

    <!-- 視聴画面。動画は DUI で枠の中（frame-video の位置）に描く。枠は動画の外側だけを囲む -->
    <div id="player-container" class="hidden">
        <div class="frame" id="frame">
            <div class="frame-header" id="frame-header">
                <div class="frame-title">
                    <span class="platform-badge" id="platform-badge">
                        <span class="tally" aria-hidden="true"></span>
                        <span id="platform-name">YouTube</span>
                        <span class="platform-badge-meta" id="play-state">再生中</span>
                    </span>
                    <span class="session-meta" id="session-meta" aria-live="polite"></span>
                </div>
                <div class="header-right">
                    <button type="button" class="back-btn" id="back-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        <span>戻る</span>
                    </button>
                    <button type="button" class="close-btn" id="player-close-btn" aria-label="閉じる" title="閉じる (ESC)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="frame-video" id="frame-video"></div>

            <div class="frame-footer" id="frame-footer">
                <div class="transport" id="transport">
                    <button type="button" class="icon-btn" id="playpause-btn" aria-label="一時停止" title="一時停止">
                        <svg id="playpause-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <rect x="6" y="5" width="4" height="14" rx="1"></rect>
                            <rect x="14" y="5" width="4" height="14" rx="1"></rect>
                        </svg>
                    </button>
                    <span class="time num" id="time-current">0:00</span>
                    <div class="track seek-track" id="seek-track">
                        <input type="range" class="track-input" id="seek-slider" min="0" max="0" step="1" value="0" aria-label="再生位置">
                        <div class="track-fill" id="seek-fill"></div>
                    </div>
                    <span class="time num" id="time-duration">0:00</span>
                    <span class="live-label hidden" id="live-label"><span class="tally" aria-hidden="true"></span>ライブ</span>
                </div>

                <div class="footer-tools">
                    <div class="volume-control">
                        <button type="button" class="volume-btn" id="volume-btn" aria-label="ミュート切り替え" title="ミュート切り替え">
                            <svg id="volume-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                            </svg>
                        </button>
                        <div class="track volume-track">
                            <input type="range" class="track-input" id="volume-slider" min="0" max="100" value="50" aria-label="音量">
                            <div class="track-fill" id="volume-fill"></div>
                        </div>
                        <span class="volume-value num" id="volume-value">50%</span>
                    </div>

                    <div class="size-control" role="group" aria-label="枠の大きさ">
                        <button type="button" class="icon-btn" id="size-down-btn" aria-label="枠を小さくする" title="小さくする (10%)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                                <line x1="6" y1="12" x2="18" y2="12"></line>
                            </svg>
                        </button>
                        <span class="size-value num" id="size-value" aria-live="polite">100%</span>
                        <button type="button" class="icon-btn" id="size-up-btn" aria-label="枠を大きくする" title="大きくする (10%)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                                <line x1="12" y1="6" x2="12" y2="18"></line>
                                <line x1="6" y1="12" x2="18" y2="12"></line>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 空間スクリーンの操作パネル（心の目 ALT から開く） -->
    <div id="screen-panel" class="dialog-layer hidden">
        <div class="input-wrapper screen-panel" id="screen-panel-dialog" role="dialog" aria-labelledby="screen-panel-title" tabindex="-1">
            <div class="input-header">
                <div class="logo">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="2" y="4" width="20" height="13" rx="2"></rect>
                        <path d="M8 21h8"></path>
                        <path d="M12 17v4"></path>
                    </svg>
                    <span id="screen-panel-title">スクリーン</span>
                    <span class="logo-meta" id="screen-owner"></span>
                </div>
                <button type="button" class="close-btn" id="screen-close-btn" aria-label="閉じる" title="閉じる (ESC)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="input-body">
                <div class="screen-now" id="screen-now">
                    <span class="tally" aria-hidden="true"></span>
                    <span id="screen-now-text">動画が設定されていません</span>
                </div>

                <div class="screen-block" id="screen-transport-block">
                    <div class="transport panel-transport">
                        <button type="button" class="icon-btn" id="screen-playpause-btn" aria-label="一時停止" title="一時停止">
                            <svg id="screen-playpause-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <rect x="6" y="5" width="4" height="14" rx="1"></rect>
                                <rect x="14" y="5" width="4" height="14" rx="1"></rect>
                            </svg>
                        </button>
                        <span class="time num" id="screen-time-current">0:00</span>
                        <div class="track seek-track">
                            <input type="range" class="track-input" id="screen-seek-slider" min="0" max="0" step="1" value="0" aria-label="再生位置">
                            <div class="track-fill" id="screen-seek-fill"></div>
                        </div>
                        <span class="time num" id="screen-time-duration">0:00</span>
                        <span class="live-label hidden" id="screen-live-label"><span class="tally" aria-hidden="true"></span>ライブ</span>
                    </div>
                    <p class="screen-note" id="screen-note"></p>
                </div>

                <div class="screen-block">
                    <div class="field-label">音量<span class="field-label-meta">自分だけ。ほかの人の音量は変わりません</span></div>
                    <div class="volume-control">
                        <button type="button" class="volume-btn" id="screen-volume-btn" aria-label="ミュート切り替え" title="ミュート切り替え">
                            <svg id="screen-volume-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                            </svg>
                        </button>
                        <div class="track volume-track wide">
                            <input type="range" class="track-input" id="screen-volume-slider" min="0" max="100" value="50" aria-label="音量（自分だけ）">
                            <div class="track-fill" id="screen-volume-fill"></div>
                        </div>
                        <span class="volume-value num" id="screen-volume-value">50%</span>
                    </div>
                </div>

                <div class="screen-block screen-manage hidden" id="screen-manage">
                    <label class="field-label" for="screen-url-input">動画を変える</label>
                    <div class="url-input-group">
                        <div class="input-icon" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                            </svg>
                        </div>
                        <input type="text" id="screen-url-input" placeholder="youtube.com/watch?v=… または twitch.tv/…" autocomplete="off" spellcheck="false" maxlength="300" aria-describedby="screen-error">
                        <button type="button" class="paste-btn" id="screen-paste-btn" aria-label="クリップボードから貼り付け" title="クリップボードから貼り付け">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="8" y="2" width="8" height="4" rx="1"></rect>
                                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                            </svg>
                        </button>
                    </div>
                    <p class="error-message hidden" id="screen-error" role="alert"></p>
                    <div class="button-group compact">
                        <button type="button" class="play-btn" id="screen-play-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M7 4.5v15a1 1 0 0 0 1.52.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"></path>
                            </svg>
                            <span>このスクリーンで再生</span>
                        </button>
                        <button type="button" class="share-btn" id="screen-stop-btn">
                            <span>動画を外す</span>
                        </button>
                    </div>
                    <div class="screen-actions">
                        <button type="button" class="list-action-btn" id="screen-move-btn">位置・大きさを変える</button>
                        <button type="button" class="list-action-btn danger" id="screen-remove-btn">撤去する</button>
                    </div>
                </div>
            </div>

            <div class="input-footer">
                <span class="input-footer-note" id="screen-size"></span>
                <span class="input-footer-hint">
                    <kbd>ESC</kbd>
                    <span>で閉じる</span>
                </span>
            </div>
        </div>
    </div>

    <!-- 空間スクリーンを置いている間の案内（ゲームを操作しながら見るので、クリックは受け付けない） -->
    <div id="place-hint" class="place-hint hidden" aria-live="polite">
        <div class="place-hint-status">
            <span class="place-dot" id="place-dot" aria-hidden="true"></span>
            <span id="place-status">ここに置けます</span>
            <span class="place-size num" id="place-size">3.0m × 1.7m</span>
        </div>
        <div class="place-hint-keys" id="place-keys"></div>
    </div>

    <!-- 共有の承諾確認・参加の申請（NUI にフォーカスが無くても表示される） -->
    <div id="share-request" class="share-request hidden" role="alertdialog" aria-labelledby="share-request-title" aria-describedby="share-request-text">
        <div class="share-request-main">
            <div class="share-request-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span class="tally"></span>
            </div>
            <div class="share-request-content">
                <div class="share-request-title" id="share-request-title">動画の共有が届きました</div>
                <div class="share-request-text" id="share-request-text"></div>
            </div>
            <div class="share-request-actions">
                <button type="button" class="share-request-accept" id="share-request-accept">視聴する</button>
                <button type="button" class="share-request-decline" id="share-request-decline">辞退</button>
            </div>
        </div>
        <div class="share-request-hint">
            <span class="share-request-keys" id="share-request-hint"></span>
            <span class="share-request-remaining" aria-hidden="true">残り <span class="num" id="share-request-remaining"></span> 秒</span>
        </div>
        <div class="share-request-timer" aria-hidden="true"><div id="share-request-bar"></div></div>
    </div>

    <!-- トースト通知 -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
