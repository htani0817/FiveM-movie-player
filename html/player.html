<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        #player-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #player-container > div,
        #player-container > iframe {
            width: 100% !important;
            height: 100% !important;
        }
        #player-container > iframe {
            border: 0;
        }
        .status-text {
            padding: 0 48px;
            color: #888;
            font-family: Arial, 'Yu Gothic UI', 'Meiryo UI', sans-serif;
            font-size: 28px;
            line-height: 1.5;
            text-align: center;
        }
        .status-text.error {
            color: #f87171;
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div class="status-text">NO SIGNAL</div>
    </div>

    <script>
        (function () {
            'use strict';

            const container = document.getElementById('player-container');
            // リソース名はホスト名（cfx-nui-<リソース名>）から求める
            const resourceName = location.hostname.replace(/^cfx-nui-/, '');
            // どの DUI か（main = 視聴画面、s1・s2… = 空間スクリーンの枠）。Lua への通知に付ける
            const slotParam = new URLSearchParams(location.search).get('slot') || 'main';
            const slot = /^[a-z0-9-]{1,16}$/.test(slotParam) ? slotParam : 'main';

            const PROGRESS_INTERVAL_MS = 1000;

            let player = null;
            let playerType = null;   // 'youtube' | 'twitch' | 'twitch-clip'
            let playerReady = false;
            let currentMedia = null;
            let currentVolume = 50;
            let playToken = 0; // 古い非同期処理の結果を捨てるための通し番号

            // 同期の目標（{ playing, position, at }。at は受け取った時刻）。null なら同期しない
            let syncTarget = null;
            let syncTolerance = 2;
            let syncTimer = null;
            let syncIntervalMs = 3000;

            const YOUTUBE_ERRORS = {
                2: 'URLが正しくありません',
                5: 'プレイヤーでエラーが発生しました',
                100: '動画が見つからないか、非公開です',
                101: 'この動画は埋め込み再生が許可されていません',
                150: 'この動画は埋め込み再生が許可されていません'
            };

            // Lua へ通知する（DUI からのコールバックが使えない環境では何もしない）
            function notifyLua(name, body) {
                const payload = Object.assign({ slot: slot }, body || {});
                try {
                    fetch('https://' + resourceName + '/' + name, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                        body: JSON.stringify(payload)
                    }).catch(function () {});
                } catch (e) {
                    // 通知できなくても再生には影響させない
                }
            }

            // 画面中央にメッセージを出す
            function showStatus(text, isError) {
                const div = document.createElement('div');
                div.className = 'status-text' + (isError ? ' error' : '');
                div.textContent = text;
                container.replaceChildren(div);
            }

            // 画面に表示し、Lua にも伝える
            function showError(text) {
                showStatus(text, true);
                notifyLua('duiStatus', { message: text });
            }

            // ---------- 外部スクリプトの遅延読み込み ----------
            // 再生要求が来たときだけ YouTube / Twitch のスクリプトを読み込む

            function withTimeout(promise, ms, message) {
                return new Promise(function (resolve, reject) {
                    const timer = setTimeout(function () { reject(new Error(message)); }, ms);
                    promise.then(function (value) {
                        clearTimeout(timer);
                        resolve(value);
                    }, function (err) {
                        clearTimeout(timer);
                        reject(err);
                    });
                });
            }

            function loadScript(src) {
                return new Promise(function (resolve, reject) {
                    const script = document.createElement('script');
                    script.src = src;
                    script.async = true;
                    script.onload = function () { resolve(); };
                    script.onerror = function () {
                        script.remove();
                        reject(new Error('script load failed: ' + src));
                    };
                    document.head.appendChild(script);
                });
            }

            let youtubeApiPromise = null;
            function loadYouTubeApi() {
                if (window.YT && window.YT.Player) {
                    return Promise.resolve();
                }
                if (!youtubeApiPromise) {
                    youtubeApiPromise = withTimeout(new Promise(function (resolve, reject) {
                        window.onYouTubeIframeAPIReady = function () { resolve(); };
                        loadScript('https://www.youtube.com/iframe_api').catch(reject);
                    }), 15000, 'YouTube API timeout').catch(function (err) {
                        youtubeApiPromise = null; // 次の再生で読み込みをやり直す
                        throw err;
                    });
                }
                return youtubeApiPromise;
            }

            let twitchApiPromise = null;
            function loadTwitchApi() {
                if (window.Twitch && window.Twitch.Player) {
                    return Promise.resolve();
                }
                if (!twitchApiPromise) {
                    twitchApiPromise = withTimeout(
                        loadScript('https://player.twitch.tv/js/embed/v1.js').then(function () {
                            if (!(window.Twitch && window.Twitch.Player)) {
                                throw new Error('Twitch API unavailable');
                            }
                        }),
                        15000,
                        'Twitch API timeout'
                    ).catch(function (err) {
                        twitchApiPromise = null;
                        throw err;
                    });
                }
                return twitchApiPromise;
            }

            // ---------- 再生 ----------

            // Lua から渡されたメディア情報を、受け取る側でも厳密に検証する
            function isValidMedia(media) {
                if (!media || typeof media !== 'object') return false;
                const id = media.id;
                if (typeof id !== 'string') return false;

                if (media.platform === 'youtube') {
                    return media.kind === 'video' && /^[A-Za-z0-9_-]{11}$/.test(id);
                }
                if (media.platform === 'twitch') {
                    if (media.kind === 'channel') return /^[A-Za-z0-9_]{1,25}$/.test(id);
                    if (media.kind === 'video') return /^[0-9]{1,20}$/.test(id);
                    if (media.kind === 'clip') return /^[A-Za-z0-9_-]{1,100}$/.test(id);
                }
                return false;
            }

            function destroyPlayer() {
                if (player) {
                    try {
                        if (playerType === 'youtube' && player.destroy) {
                            player.destroy();
                        }
                    } catch (e) {
                        console.log('Error destroying player:', e);
                    }
                }
                player = null;
                playerType = null;
                playerReady = false;
            }

            function createMount() {
                const mount = document.createElement('div');
                mount.id = 'player';
                container.replaceChildren(mount);
            }

            function onPlayerReady() {
                playerReady = true;
                applySync();
                reportProgress();
            }

            function startYouTube(media, token) {
                createMount();
                playerType = 'youtube';
                player = new YT.Player('player', {
                    width: '100%',
                    height: '100%',
                    videoId: media.id,
                    playerVars: {
                        autoplay: 1,
                        controls: 1,
                        modestbranding: 1,
                        rel: 0,
                        playsinline: 1
                    },
                    events: {
                        onReady: function (event) {
                            if (token !== playToken) return;
                            event.target.setVolume(currentVolume);
                            if (currentVolume > 0) event.target.unMute();
                            event.target.playVideo();
                            onPlayerReady();
                        },
                        onStateChange: function () {
                            if (token !== playToken) return;
                            reportProgress();
                        },
                        onError: function (event) {
                            if (token !== playToken) return;
                            const message = YOUTUBE_ERRORS[event.data] || ('動画を再生できません（エラー ' + event.data + '）');
                            destroyPlayer();
                            showError(message);
                        }
                    }
                });
            }

            function startTwitch(media, token) {
                const parent = location.hostname;

                if (media.kind === 'clip') {
                    // クリップは iframe で埋め込む（音量・再生位置の操作はできない）
                    const iframe = document.createElement('iframe');
                    iframe.src = 'https://clips.twitch.tv/embed?clip=' + encodeURIComponent(media.id) +
                        '&parent=' + encodeURIComponent(parent) + '&autoplay=true';
                    iframe.setAttribute('allow', 'autoplay; fullscreen');
                    iframe.allowFullscreen = true;
                    container.replaceChildren(iframe);
                    playerType = 'twitch-clip';
                    reportProgress();
                    return;
                }

                createMount();
                playerType = 'twitch';

                const options = {
                    width: '100%',
                    height: '100%',
                    autoplay: true,
                    muted: false,
                    parent: [parent]
                };
                if (media.kind === 'channel') {
                    options.channel = media.id;
                } else {
                    options.video = media.id;
                }

                player = new Twitch.Player('player', options);
                player.addEventListener(Twitch.Player.READY, function () {
                    if (token !== playToken) return;
                    player.setVolume(currentVolume / 100);
                    player.setMuted(currentVolume === 0);
                    onPlayerReady();
                });
                player.addEventListener(Twitch.Player.PLAY, function () {
                    if (token === playToken) reportProgress();
                });
                player.addEventListener(Twitch.Player.PAUSE, function () {
                    if (token === playToken) reportProgress();
                });
            }

            async function playMedia(media) {
                const token = ++playToken;
                destroyPlayer();
                currentMedia = null;

                if (!isValidMedia(media)) {
                    showError('再生できないURLです');
                    return;
                }
                currentMedia = media;

                showStatus('LOADING...');

                try {
                    if (media.platform === 'youtube') {
                        await loadYouTubeApi();
                        if (token !== playToken) return;
                        startYouTube(media, token);
                    } else {
                        await loadTwitchApi();
                        if (token !== playToken) return;
                        startTwitch(media, token);
                    }
                } catch (err) {
                    console.log('Play error:', err);
                    if (token !== playToken) return;
                    destroyPlayer();
                    const name = media.platform === 'youtube' ? 'YouTube' : 'Twitch';
                    showError(name + ' のプレイヤーを読み込めませんでした。ネットワークを確認してください');
                }
            }

            function setVolume(volume) {
                const value = Number(volume);
                if (!Number.isFinite(value)) return;
                currentVolume = Math.max(0, Math.min(100, Math.round(value)));

                if (!player) return;

                try {
                    if (playerType === 'youtube' && player.setVolume) {
                        player.setVolume(currentVolume);
                        if (currentVolume > 0) player.unMute();
                        else player.mute();
                    } else if (playerType === 'twitch' && player.setVolume) {
                        player.setVolume(currentVolume / 100);
                        player.setMuted(currentVolume === 0);
                    }
                } catch (e) {
                    console.log('Error setting volume:', e);
                }
            }

            function stopVideo() {
                playToken++;
                destroyPlayer();
                currentMedia = null;
                syncTarget = null;
                showStatus('NO SIGNAL');
                reportProgress();
            }

            // ---------- 再生位置（取得・操作） ----------

            // ライブ配信か（ライブは再生位置を合わせない）
            function isLive() {
                if (!currentMedia) return false;
                if (currentMedia.platform === 'twitch') return currentMedia.kind === 'channel';
                if (playerType === 'youtube' && player && playerReady && player.getVideoData) {
                    try {
                        const data = player.getVideoData();
                        return !!(data && data.isLive === true);
                    } catch (e) {
                        return false;
                    }
                }
                return false;
            }

            // 再生位置を操作できるプレイヤーか（Twitch のクリップとライブは不可）
            function isSeekable() {
                return !!(player && playerReady && (playerType === 'youtube' || playerType === 'twitch') && !isLive());
            }

            function getTime() {
                if (!player || !playerReady) return null;
                try {
                    const value = player.getCurrentTime();
                    return Number.isFinite(value) ? value : null;
                } catch (e) {
                    return null;
                }
            }

            function getDuration() {
                if (!player || !playerReady) return null;
                try {
                    const value = player.getDuration();
                    return Number.isFinite(value) && value > 0 ? value : null;
                } catch (e) {
                    return null;
                }
            }

            function isPaused() {
                if (!player || !playerReady) return false;
                try {
                    if (playerType === 'youtube') {
                        const state = player.getPlayerState();
                        return state === YT.PlayerState.PAUSED || state === YT.PlayerState.CUED;
                    }
                    if (playerType === 'twitch') return player.isPaused();
                } catch (e) {
                    return false;
                }
                return false;
            }

            function isEnded() {
                if (!player || !playerReady) return false;
                try {
                    if (playerType === 'youtube') return player.getPlayerState() === YT.PlayerState.ENDED;
                    if (playerType === 'twitch' && player.getEnded) return player.getEnded();
                } catch (e) {
                    return false;
                }
                return false;
            }

            function seekTo(seconds) {
                if (!isSeekable()) return;
                const duration = getDuration();
                let target = Math.max(0, seconds);
                if (duration) target = Math.min(target, Math.max(0, duration - 0.5));
                try {
                    if (playerType === 'youtube') player.seekTo(target, true);
                    else player.seek(target);
                } catch (e) {
                    console.log('Error seeking:', e);
                }
            }

            function setPaused(paused) {
                if (!player || !playerReady || playerType === 'twitch-clip') return;
                try {
                    if (playerType === 'youtube') {
                        if (paused) player.pauseVideo(); else player.playVideo();
                    } else {
                        if (paused) player.pause(); else player.play();
                    }
                } catch (e) {
                    console.log('Error pausing:', e);
                }
            }

            // 同期の目標に合わせる（ずれが許容範囲を超えたときだけ位置を動かす）
            function applySync() {
                if (!syncTarget || !isSeekable()) return;

                const expected = syncTarget.playing
                    ? syncTarget.position + (performance.now() - syncTarget.at) / 1000
                    : syncTarget.position;
                const duration = getDuration();
                const current = getTime();

                if (current !== null && !(duration && expected >= duration && isEnded())) {
                    if (Math.abs(current - expected) > syncTolerance) {
                        seekTo(expected);
                    }
                }
                if (syncTarget.playing && isPaused()) {
                    setPaused(false);
                } else if (!syncTarget.playing && !isPaused()) {
                    setPaused(true);
                }
            }

            function setSyncTarget(data) {
                const position = Number(data.position);
                if (!Number.isFinite(position) || typeof data.playing !== 'boolean') return;
                syncTarget = { playing: data.playing, position: Math.max(0, position), at: performance.now() };
                applySync();
            }

            // 再生位置と状態を Lua に知らせる（枠のシークバーと、ホストの再生位置の報告に使う）
            function reportProgress() {
                notifyLua('duiProgress', {
                    active: !!currentMedia,
                    ready: playerReady || playerType === 'twitch-clip',
                    time: getTime(),
                    duration: getDuration(),
                    paused: isPaused(),
                    live: isLive(),
                    seekable: isSeekable(),
                    controllable: !!(player && playerReady && playerType !== 'twitch-clip')
                });
            }

            setInterval(function () {
                if (currentMedia) reportProgress();
            }, PROGRESS_INTERVAL_MS);

            function restartSyncTimer() {
                clearInterval(syncTimer);
                syncTimer = setInterval(applySync, syncIntervalMs);
            }

            // ---------- メッセージ受信（Lua → DUI） ----------

            window.addEventListener('message', function (event) {
                // 子 iframe（YouTube / Twitch）からのメッセージは受け付けない
                if (event.source && event.source !== window) return;

                let data = event.data;
                if (typeof data === 'string') {
                    try {
                        data = JSON.parse(data);
                    } catch (e) {
                        return;
                    }
                }
                if (!data || typeof data !== 'object') return;

                switch (data.action) {
                    case 'play':
                        syncTarget = null;
                        playMedia(data.media);
                        break;
                    case 'stop':
                        stopVideo();
                        break;
                    case 'volume':
                        setVolume(data.volume);
                        break;
                    case 'syncConfig':
                        if (Number.isFinite(data.tolerance) && data.tolerance > 0) syncTolerance = data.tolerance;
                        if (Number.isFinite(data.intervalMs) && data.intervalMs >= 500) {
                            syncIntervalMs = data.intervalMs;
                            restartSyncTimer();
                        }
                        break;
                    case 'sync':
                        setSyncTarget(data);
                        break;
                    case 'unsync':
                        syncTarget = null;
                        break;
                    case 'pause':
                        setPaused(true);
                        reportProgress();
                        break;
                    case 'resume':
                        setPaused(false);
                        reportProgress();
                        break;
                    case 'seek':
                        if (Number.isFinite(Number(data.position))) {
                            seekTo(Number(data.position));
                            reportProgress();
                        }
                        break;
                }
            });

            restartSyncTimer();

            // 準備完了を Lua に知らせる
            notifyLua('duiReady', {});
        })();
    </script>
</body>
</html>
